<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고1 아침 공부 인증</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="max-w-md mx-auto w-full min-h-screen flex flex-col bg-white shadow-lg relative">
        
        <!-- ================= 1. 닉네임 입력 화면 ================= -->
        <div id="login-screen" class="flex-1 flex flex-col justify-center items-center p-6 bg-gradient-to-b from-indigo-500 to-indigo-700 text-white">
            <div class="w-full max-w-sm bg-white text-slate-800 rounded-2xl p-8 shadow-2xl">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full mb-3 text-2xl font-bold shadow-inner">
                        <i class="fa-solid fa-sun"></i>
                    </div>
                    <h1 class="text-2xl font-bold">고1 아침 공부 인증</h1>
                    <p class="text-sm text-slate-500 mt-1">상쾌한 아침, 오늘도 힘차게 시작해봐요!</p>
                </div>
                
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">사용할 닉네임</label>
                        <input type="text" id="nickname-input" required placeholder="닉네임을 입력하세요" 
                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-lg hover:bg-indigo-700 transition">
                        시작하기
                    </button>
                </form>
            </div>
        </div>

        <!-- ================= 2. 메인 대시보드 화면 ================= -->
        <div id="main-screen" class="hidden flex-1 flex flex-col bg-slate-50">
            <!-- 상단 헤더 -->
            <header class="bg-white px-5 py-4 border-b border-slate-200 flex justify-between items-center sticky top-0 z-10">
                <div>
                    <span class="text-xs text-indigo-600 font-semibold" id="header-badge">고1 아침 공부</span>
                    <h2 class="text-lg font-bold text-slate-800" id="header-nickname">닉네임</h2>
                </div>
                <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-slate-600 px-3 py-1.5 rounded-lg border border-slate-200">
                    로그아웃
                </button>
            </header>

            <!-- 탭 콘텐츠 영역 -->
            <main class="flex-1 pb-20 overflow-y-auto">
                
                <!-- 탭 1: 나의 챌린지 기록 -->
                <div id="tab-my-record" class="p-5 space-y-5">
                    <!-- 누적 공부 일수 카드 -->
                    <div class="bg-gradient-to-r from-indigo-500 to-violet-600 text-white rounded-2xl p-6 shadow-md relative overflow-hidden">
                        <div class="relative z-10">
                            <p class="text-xs font-medium text-indigo-100 uppercase tracking-wider">나의 누적 공부 일수</p>
                            <div class="flex items-baseline mt-1">
                                <span class="text-4xl font-extrabold tracking-tight" id="my-streak-count">0</span>
                                <span class="text-lg ml-1 font-medium">일 달성 중 🔥</span>
                            </div>
                            <p class="text-xs text-indigo-100 mt-3" id="last-auth-date">아직 오늘 인증 기록이 없습니다.</p>
                        </div>
                        <div class="absolute right-[-10px] bottom-[-20px] text-white/10 text-8xl font-black">
                            <i class="fa-solid fa-award"></i>
                        </div>
                    </div>

                    <!-- 오늘 나의 결심 입력 섹션 -->
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-3">
                        <h3 class="font-bold text-slate-800 text-sm flex items-center">
                            <i class="fa-solid fa-bullseye text-indigo-500 mr-2"></i> 오늘 나의 결심
                        </h3>
                        <textarea id="today-resolution" rows="3" placeholder="오늘 아침 공부 목표와 다짐을 적어보세요! (예: 수학 단원평가 대비 오답노트 정리)"
                            class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
                    </div>

                    <!-- 사진 인증 섹션 -->
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                        <h3 class="font-bold text-slate-800 text-sm flex items-center">
                            <i class="fa-solid fa-camera text-indigo-500 mr-2"></i> 아침 공부 사진 인증
                        </h3>
                        
                        <!-- 사진 미리보기 및 선택 영역 -->
                        <div id="image-preview-container" class="hidden relative rounded-xl overflow-hidden bg-slate-100 h-48 border border-slate-200 flex items-center justify-center">
                            <img id="preview-img" src="" alt="인증 사진 미리보기" class="w-full h-full object-cover">
                            <button onclick="clearImage()" class="absolute top-3 right-3 bg-black/60 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs hover:bg-black">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <!-- 업로드 버튼들 (인앱 카메라 스트림 오픈 및 파일 선택) -->
                        <div id="upload-buttons" class="grid grid-cols-2 gap-3">
                            <button type="button" onclick="openCameraModal()" class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-indigo-200 bg-indigo-50/50 rounded-xl cursor-pointer hover:bg-indigo-50 transition text-indigo-600">
                                <i class="fa-solid fa-camera text-xl mb-1"></i>
                                <span class="text-xs font-semibold">카메라 촬영</span>
                            </button>
                            <button type="button" onclick="document.getElementById('gallery-file-input').click();" class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-slate-200 bg-slate-50 rounded-xl cursor-pointer hover:bg-slate-100 transition text-slate-600">
                                <i class="fa-solid fa-image text-xl mb-1"></i>
                                <span class="text-xs font-semibold">파일 등록</span>
                                <input type="file" id="gallery-file-input" accept="image/*" onchange="handleImageSelect(event)" class="hidden">
                            </button>
                        </div>
                    </div>

                    <!-- 인증 제출 버튼 -->
                    <button onclick="submitAuthentication()" id="submit-btn" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-check-circle"></i>
                        <span>오늘의 아침 공부 인증 완료하기</span>
                    </button>
                </div>

                <!-- 탭 2: 우리 반 피드 -->
                <div id="tab-class-feed" class="p-5 space-y-4 hidden">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-slate-800 text-base">친구들 아침 공부 피드</h3>
                        <button onclick="loadFeed()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium flex items-center">
                            <i class="fa-solid fa-rotate-right mr-1"></i> 새로고침
                        </button>
                    </div>

                    <div id="feed-list" class="space-y-4">
                        <!-- 피드 항목들이 동적으로 로드됩니다 -->
                    </div>
                </div>
            </main>

            <!-- 하단 네비게이션 탭 바 -->
            <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-3 z-10 shadow-lg">
                <button onclick="switchTab('my-record')" id="nav-btn-my-record" class="flex flex-col items-center text-indigo-600 space-y-1 transition">
                    <i class="fa-solid fa-user-check text-lg"></i>
                    <span class="text-[11px] font-semibold">나의 기록</span>
                </button>
                <button onclick="switchTab('class-feed')" id="nav-btn-class-feed" class="flex flex-col items-center text-slate-400 space-y-1 transition">
                    <i class="fa-solid fa-users-viewfinder text-lg"></i>
                    <span class="text-[11px] font-semibold">우리 반 피드</span>
                </button>
            </nav>
        </div>

        <!-- ================= 인앱 실시간 카메라 촬영 모달 ================= -->
        <div id="camera-modal" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-between p-6">
            <div class="w-full flex justify-between items-center text-white py-2">
                <h3 class="font-bold text-base">실시간 카메라 촬영</h3>
                <button onclick="closeCameraModal()" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="relative w-full max-w-sm aspect-[3/4] bg-black rounded-2xl overflow-hidden flex items-center justify-center border border-white/20 shadow-2xl">
                <video id="camera-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="camera-canvas" class="hidden"></canvas>
            </div>

            <div class="w-full flex justify-center py-4">
                <button type="button" onclick="takeSnapshot()" class="w-20 h-20 rounded-full bg-white border-4 border-indigo-600 flex items-center justify-center shadow-2xl active:scale-95 transition">
                    <div class="w-16 h-16 rounded-full bg-indigo-600"></div>
                </button>
            </div>
        </div>

        <!-- 알림 모달 -->
        <div id="custom-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-xs w-full p-6 text-center shadow-2xl space-y-4">
                <div id="modal-icon" class="text-4xl text-indigo-600 mb-1">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h4 id="modal-title" class="font-bold text-slate-800 text-lg">알림</h4>
                <p id="modal-message" class="text-sm text-slate-600">메시지 내용입니다.</p>
                <button onclick="closeModal()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold text-sm hover:bg-indigo-700 transition">
                    확인
                </button>
            </div>
        </div>

    </div>

    <!-- ================= 프런트엔드 로직 스크립트 ================= -->
    <script>
        // Google Apps Script 웹 앱 배포 URL
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwS1ah7-4uHQYnCdB5ozgaBEfdNCvszYItqj65mnHyNI-rfEv0P4U-X3WBJBC84mmSvZQ/exec';

        let currentUser = {
            nickname: localStorage.getItem('morning_study_nickname') || ''
        };
        let base64Image = '';
        let mediaStream = null;

        window.onload = function() {
            if (currentUser.nickname) {
                document.getElementById('nickname-input').value = currentUser.nickname;
                showMainScreen();
            }
        };

        async function handleLogin(event) {
            event.preventDefault();
            const nickname = document.getElementById('nickname-input').value.trim();

            if (!nickname) {
                showModal('입력 오류', '닉네임을 입력해주세요.', 'error');
                return;
            }

            currentUser.nickname = nickname;
            localStorage.setItem('morning_study_nickname', nickname);

            showMainScreen();
        }

        function handleLogout() {
            if (window.confirm('정말 로그아웃 하시겠습니까? (저장된 닉네임이 초기화됩니다)')) {
                localStorage.removeItem('morning_study_nickname');
                currentUser.nickname = '';
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('main-screen').classList.add('hidden');
            }
        }

        function showMainScreen() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('header-nickname').innerText = currentUser.nickname;
            
            fetchUserData();
        }

        function switchTab(tabName) {
            const myRecordTab = document.getElementById('tab-my-record');
            const classFeedTab = document.getElementById('tab-class-feed');
            const navMyBtn = document.getElementById('nav-btn-my-record');
            const navFeedBtn = document.getElementById('nav-btn-class-feed');

            if (tabName === 'my-record') {
                myRecordTab.classList.remove('hidden');
                classFeedTab.classList.add('hidden');
                navMyBtn.className = "flex flex-col items-center text-indigo-600 space-y-1 transition";
                navFeedBtn.className = "flex flex-col items-center text-slate-400 space-y-1 transition";
                fetchUserData();
            } else {
                myRecordTab.classList.add('hidden');
                classFeedTab.classList.remove('hidden');
                navMyBtn.className = "flex flex-col items-center text-slate-400 space-y-1 transition";
                navFeedBtn.className = "flex flex-col items-center text-indigo-600 space-y-1 transition";
                loadFeed();
            }
        }

        async function openCameraModal() {
            const modal = document.getElementById('camera-modal');
            const videoEl = document.getElementById('camera-video');
            modal.classList.remove('hidden');

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                videoEl.srcObject = mediaStream;
            } catch (err) {
                modal.classList.add('hidden');
                showModal('카메라 접근 오류', '카메라 권한이 거부되었거나 기기에서 지원하지 않습니다. 파일 등록을 이용해주세요.', 'warning');
            }
        }

        function closeCameraModal() {
            const modal = document.getElementById('camera-modal');
            modal.classList.add('hidden');
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function takeSnapshot() {
            const videoEl = document.getElementById('camera-video');
            const canvasEl = document.getElementById('camera-canvas');
            
            canvasEl.width = videoEl.videoWidth || 640;
            canvasEl.height = videoEl.videoHeight || 480;
            const ctx = canvasEl.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

            base64Image = canvasEl.toDataURL('image/jpeg', 0.85);
            document.getElementById('preview-img').src = base64Image;
            document.getElementById('image-preview-container').classList.remove('hidden');
            document.getElementById('upload-buttons').classList.add('hidden');

            closeCameraModal();
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                base64Image = e.target.result;
                document.getElementById('preview-img').src = base64Image;
                document.getElementById('image-preview-container').classList.remove('hidden');
                document.getElementById('upload-buttons').classList.add('hidden');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function clearImage() {
            base64Image = '';
            document.getElementById('preview-img').src = '';
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('upload-buttons').classList.remove('hidden');
        }

        async function fetchUserData() {
            if (!GAS_WEB_APP_URL) return;

            try {
                const response = await fetch(`${GAS_WEB_APP_URL}?action=getUserData&nickname=${encodeURIComponent(currentUser.nickname)}`, {
                    method: 'GET',
                    mode: 'cors'
                });
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('my-streak-count').innerText = result.streak || 0;
                    if (result.lastDate) {
                        document.getElementById('last-auth-date').innerText = `최근 인증일: ${result.lastDate}`;
                    } else {
                        document.getElementById('last-auth-date').innerText = `아직 오늘 인증 기록이 없습니다.`;
                    }
                }
            } catch (err) {
                console.warn('백엔드 연결 대기 중 (CORS 혹은 오프라인 상태):', err);
            }
        }

        async function submitAuthentication() {
            const resolution = document.getElementById('today-resolution').value.trim();
            if (!resolution) {
                showModal('결심 작성 필요', '오늘 나의 결심을 작성해주세요!', 'warning');
                return;
            }
            if (!base64Image) {
                showModal('사진 인증 필요', '아침 공부 인증 사진을 촬영하거나 등록해주세요!', 'warning');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> 인증 전송 중...';

            try {
                const payload = {
                    action: 'submitAuth',
                    nickname: currentUser.nickname,
                    resolution: resolution,
                    image: base64Image
                };

                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'cors',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.success) {
                    showModal('인증 완료! 🎉', result.message || '오늘의 아침 공부 인증이 성공적으로 저장되었습니다!', 'success');
                    document.getElementById('today-resolution').value = '';
                    clearImage();
                    fetchUserData();
                } else {
                    showModal('오류 발생', result.message || '인증 저장 중 오류가 발생했습니다.', 'error');
                }
            } catch (err) {
                showModal('통신 안내', '서버와 통신하는 중 문제가 발생했습니다. Google Apps Script 배포 시 액세스 권한이 "모두(Anyone)"로 설정되어 있는지 확인해주세요.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-check-circle mr-2"></i> 오늘의 아침 공부 인증 완료하기';
            }
        }

        async function loadFeed() {
            const feedList = document.getElementById('feed-list');
            feedList.innerHTML = `
                <div class="text-center py-12 text-slate-400 text-sm">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                    <p>피드를 불러오는 중입니다...</p>
                </div>
            `;

            try {
                const response = await fetch(`${GAS_WEB_APP_URL}?action=getFeed`, {
                    method: 'GET',
                    mode: 'cors'
                });
                const result = await response.json();

                feedList.innerHTML = '';
                if (result.success && result.feed && result.feed.length > 0) {
                    result.feed.forEach(item => {
                        const feedItem = document.createElement('div');
                        feedItem.className = "bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3";
                        feedItem.innerHTML = `
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-slate-800 text-sm">${escapeHtml(item.nickname)}</span>
                                <span class="text-[11px] text-slate-400">${escapeHtml(item.date)}</span>
                            </div>
                            <p class="text-sm text-slate-600 bg-indigo-50/50 p-3 rounded-xl border border-indigo-100/50">
                                "${escapeHtml(item.resolution)}"
                            </p>
                            ${item.image ? `<div class="rounded-xl overflow-hidden bg-slate-100 h-56"><img src="${item.image}" class="w-full h-full object-cover"></div>` : ''}
                        `;
                        feedList.append(feedItem);
                    });
                } else {
                    feedList.innerHTML = `
                        <div class="text-center py-12 text-slate-400 text-sm">
                            <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
                            <p>아직 등록된 인증 피드가 없습니다.</p>
                        </div>
                    `;
                }
            } catch (err) {
                feedList.innerHTML = `
                    <div class="text-center py-12 text-slate-400 text-sm">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 text-amber-500"></i>
                        <p>피드를 불러오지 못했습니다. Google Apps Script 웹 앱 권한을 확인해주세요.</p>
                    </div>
                `;
            }
        }

        function showModal(title, message, type = 'success') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            
            const iconEl = document.getElementById('modal-icon');
            if (type === 'success') {
                iconEl.className = "text-4xl text-emerald-500 mb-1";
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else if (type === 'warning') {
                iconEl.className = "text-4xl text-amber-500 mb-1";
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                iconEl.className = "text-4xl text-rose-500 mb-1";
                iconEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
            }

            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
